name: tests
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install --quiet -r requirements-dev.txt && pip install --quiet --no-deps -e .   # the same pinned files a newcomer installs
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: sentinel selftest
      - run: pytest -q
