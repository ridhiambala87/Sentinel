# A direct push with [skip ci] suppresses push workflows. It cannot suppress a schedule.
name: sentinel-nightly
on: { schedule: [{ cron: "17 2 * * *" }], workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install --quiet ".[sign]"
      - run: sentinel verify --no-pin && sentinel scan .
      - name: Verify sleeper replay and recording slice
        run: |
          sentinel timewarp run tests/fixtures/sleeper/AGENTS.md --replay tests/fixtures/sleeper || [ $? -eq 1 ]
          mkdir -p /tmp/nightly_cassette
          sentinel timewarp run tests/fixtures/sleeper/AGENTS.md --record /tmp/nightly_cassette --mock --trace
          sentinel timewarp run tests/fixtures/sleeper/AGENTS.md --replay /tmp/nightly_cassette
